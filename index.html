<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>중국어 발음 & 성장 분석 시스템</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f0f4f9;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <!-- 앱스크립트 배포 주소를 넣고 microphone 권한을 명시 -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbznLD9KBp9L63JzHuR0VahujU-03gLyUWRz8jqNDEbxCwWCf_O39YhDOCROCCWRki8QHQ/exec" 
    allow="microphone; camera; clipboard-write; autoplay"
    allowfullscreen>
  </iframe>
</body>
</html>
